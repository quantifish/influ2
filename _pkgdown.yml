url: https://www.quantifish.co.nz/influ2/

template:
  bootstrap: 5
  bootswatch: cerulean

navbar:
  structure:
    left:  [intro, articles, tutorials, reference, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Residual diagnostics
        href: articles/residual-diagnostics.html
      - text: CPUE indices
        href: articles/cpue-indices.html
      - text: Model comparison
        href: articles/model-comparison.html
      - text: Hurdle, delta, and zero-inflated models
        href: articles/hurdle.html
      - text: Spatial and spatiotemporal diagnostics
        href: articles/spatial-spatiotemporal.html
      - text: Legacy Get Started (frozen)
        href: articles/legacy-get-started.html
      - text: Bentley validation
        href: articles/bentley-validation.html

articles:
- title: Vignettes
  navbar: ~
  contents:
  - residual-diagnostics
  - influ2
  - cpue-indices
  - model-comparison
  - hurdle
  - spatial-spatiotemporal
  - bentley-validation

reference:
- title: Model-neutral diagnostics
  desc: >
    Calculate and inspect influence diagnostics. The [plot() and autoplot()](plot.influ_diag.html)
    methods here display `influ_diag` objects, including influence and CDI plots.
  contents:
  - influ
  - influ.brmsfit
  - influ.gam
  - influ.glm
  - influ.glmmTMB
  - influ.sdmTMB
  - influ.tinyVAST
  - influ_effects
  - influ_indices
  - influ_composition
  - influ_draws
  - influ_metrics
  - influ_families
  - plot.influ_diag

- title: Additional diagnostics and comparisons
  desc: >
    Compare indices and model steps, and inspect sampling composition and data
    coverage. The [plot() and autoplot()](plot.influ_steps.html) methods here display `influ_steps` objects.
  contents:
  - plot_bubble
  - plot_compare
  - influ_steps
  - plot.influ_steps
  - plot_step
  - plot_data_extent

- title: CPUE indices and assessment tables
  desc: >
    Calculate standardised means or area-integrated totals. Use
    [plot_index(), plot(), or autoplot()](plot_index.html) to display the
    resulting `influ_index` objects.
  contents:
  - cpue_index
  - integrate_index
  - plot_index
  - geo_mean

- title: Residual diagnostics
  desc: >
    Inspect generalised residual patterns, grouped departures, and quantile
    comparisons. The [plot() and autoplot()](plot.influ_residuals.html) methods here display
    `influ_residuals` objects.
  contents:
  - influ_residuals
  - as_influ_residuals
  - plot.influ_residuals
  - plot_implied_residuals
  - plot_predicted_residuals

- title: Model comparison
  desc: Model-specific likelihood and Bayesian criteria, with explicit comparison safeguards.
  contents:
  - get_bayes_R2
  - table_criterion

- title: Data
  desc: Simulated data supplied with the package.
  contents:
  - lobsters_per_pot

- title: Package
  contents:
  - influ2
