# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Keep numerical-library threading scoped to this check process.
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      BLIS_NUM_THREADS: 1
      VECLIB_MAXIMUM_THREADS: 1

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
          extra-repositories: https://vast-lib.r-universe.dev

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Install R manual fonts and index tool
        # R's Windows manual needs Courier and makeindex, absent from TinyTeX-1.
        # Refresh tlmgr first: a newly downloaded bundle can lag its repository.
        shell: bash
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          # Bash does not resolve Windows .bat launchers; use the native shell.
          tlmgr_name <- if (.Platform$OS.type == "windows") "tlmgr.bat" else "tlmgr"
          tlmgr <- Sys.which(tlmgr_name)
          if (!nzchar(tlmgr)) stop("The TinyTeX package manager is not available")
          run_tlmgr <- function(args) {
            message("tlmgr ", paste(args, collapse = " "))
            status <- if (.Platform$OS.type == "windows") {
              system2(Sys.getenv("COMSPEC", "cmd.exe"),
                      c("/d", "/c", "call", shQuote(tlmgr), args))
            } else {
              system2(tlmgr, args)
            }
            if (status != 0L) stop("TinyTeX provisioning failed: ", paste(args, collapse = " "))
          }
          run_tlmgr(c("update", "--self"))
          run_tlmgr(c("install", "courier", "makeindex"))
          manual_tools <- Sys.which(c("pdflatex", "makeindex"))
          print(manual_tools)
          if (any(!nzchar(manual_tools))) {
            stop("The R manual's TeX tools are not available on R's PATH")
          }
          makeindex <- normalizePath(manual_tools[["makeindex"]], winslash = "/", mustWork = TRUE)
          index_probe <- system2(makeindex, "-q", input = R"(\indexentry{influ2}{1})",
                                 stdout = TRUE, stderr = TRUE)
          if (!is.null(attr(index_probe, "status")) || !any(grepl("influ2, 1", index_probe, fixed = TRUE))) {
            stop("The R manual's makeindex executable cannot run")
          }
          # R's texi2dvi emulation reads MAKEINDEX, including on Windows.
          writeLines(paste0("MAKEINDEX=", makeindex), Sys.getenv("GITHUB_ENV"))
          RSCRIPT

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check PDF manual before the worked examples
        # PowerShell aliases R to Invoke-History; use the executable in Bash.
        shell: bash
        run: R CMD Rd2pdf --no-preview --force --output="${{ runner.temp }}/influ2-manual.pdf" .

      - name: Retain compiled PDF manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: influ2-manual-${{ runner.os }}
          path: ${{ runner.temp }}/influ2-manual.pdf

      - name: Check minimal installation and saved results
        if: matrix.config.os == 'ubuntu-latest'
        run: Rscript --vanilla tools/check-minimal-install.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--timings")'
          build_args: 'character()'
          error-on: '"warning"'
